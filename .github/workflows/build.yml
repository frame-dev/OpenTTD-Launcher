name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, windows-11-arm, macos-latest, macos-15-intel, macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.os == 'windows-11-arm' && 'microsoft' || 'temurin' }}
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode clean verify
